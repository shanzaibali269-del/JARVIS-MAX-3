name: JARVIS MAX 3.0 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract JARVIS project
        run: |
          mkdir -p buildsrc
          unzip -q JARVIS_MAX_3_0_PHONE_CLOUD.zip -d buildsrc

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: buildsrc/JARVIS_MAX_3_0
        run: |
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-MAX-3.0-APK
          path: buildsrc/JARVIS_MAX_3_0/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
